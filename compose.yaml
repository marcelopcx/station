# Runtime solo (sin juego). Para una partida usá el compose de la raíz:
#   GAME=supertuxkart docker compose -f ../compose.yaml up --build
services:
  game-station-runtime:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: airtek/game-station-runtime:latest
    environment:
      STATION_ID: ${STATION_ID:-spark-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8090:8090"
    init: true
    restart: unless-stopped
