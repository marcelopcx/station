# Estación + cliente S2+S3 en el Spark. Host network: ICE/UDP usa las NICs reales.
# game-client tiene que estar al lado: ../game-client
#
#   ICE_HOST_IPS=156.255.130.66 PUBLIC_HOST=156.255.130.66 \
#     docker compose -f compose.spark.yaml up --build
services:
  game-station:
    build: .
    image: airtek/game-station:s2
    network_mode: host
    runtime: nvidia
    environment:
      STATION_ID: ${STATION_ID:-spark-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://localhost}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-https?://.*}
      ICE_INCLUDE_LOOPBACK: "0"
      ICE_HOST_POLICY: ${ICE_HOST_POLICY:-public}
      ICE_HOST_IPS: ${ICE_HOST_IPS:-}
      ICE_SERVERS: ${ICE_SERVERS:-stun:stun.l.google.com:19302}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      STATION_DISPLAY: ":99"
      STATION_SIZE: "1280x720"
      STK_BIN: /opt/stk/run_game.sh
      LIBRARY_ROOT: /opt/station-library
      CACHE_ROOT: /cache
      IDLE_TIMEOUT_S: ${IDLE_TIMEOUT_S:-300}
    devices:
      - /dev/dri
      - /dev/uinput
    volumes:
      - /dev/input:/dev/input
      - station-cache:/cache
    device_cgroup_rules:
      - "c 13:* rmw"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 8s

  game-client:
    build:
      context: ../game-client
      args:
        VITE_STATION_URL: /station
        VITE_ICE_SERVERS: stun:stun.l.google.com:19302
        VITE_GAME_ID: supertuxkart
    image: airtek/game-client:s2
    network_mode: host
    environment:
      STATION_UPSTREAM: http://127.0.0.1:8090
      NGINX_ENVSUBST_FILTER: STATION_UPSTREAM
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    depends_on:
      game-station:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  station-cache:


