# Preferí el compose de la raíz del checkout:
#   cd .. && GAME=supertuxkart docker compose -f compose.spark.yaml up --build
#
# Este archivo queda para quien trabaje solo dentro de game-station/.
name: airtek-station

services:
  runtime:
    image: airtek/game-station-runtime:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["/bin/true"]
    restart: "no"
    init: true

  game-station:
    image: airtek/game-station-${GAME:-supertuxkart}
    build:
      context: ../games/${GAME:-supertuxkart}
      args:
        RUNTIME_IMAGE: airtek/game-station-runtime:latest
    network_mode: host
    runtime: nvidia
    environment:
      STATION_ID: ${STATION_ID:-spark-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://localhost}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-https?://.*}
      ICE_INCLUDE_LOOPBACK: "0"
      ICE_HOST_POLICY: ${ICE_HOST_POLICY:-public}
      ICE_HOST_IPS: ${ICE_HOST_IPS:-}
      ICE_SERVERS: ${ICE_SERVERS:-stun:stun.l.google.com:19302}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      STATION_DISPLAY: ":99"
      STATION_SIZE: "1280x720"
      LIBRARY_ROOT: /opt/station-library
      CACHE_ROOT: /cache
      IDLE_TIMEOUT_S: ${IDLE_TIMEOUT_S:-300}
    devices:
      - /dev/dri
      - /dev/uinput
    volumes:
      - /dev/input:/dev/input
      - station-cache:/cache
    device_cgroup_rules:
      - "c 13:* rmw"
    depends_on:
      runtime:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; p=os.environ.get('STATION_HTTP_PORT','8090'); urllib.request.urlopen(f'http://127.0.0.1:{p}/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 8s

  game-client:
    build:
      context: ../game-client
      args:
        VITE_STATION_URL: /station
        VITE_ICE_SERVERS: stun:stun.l.google.com:19302
        VITE_GAME_ID: ${GAME:-supertuxkart}
    image: airtek/game-client:s2
    network_mode: host
    environment:
      STATION_UPSTREAM: http://127.0.0.1:8090
      NGINX_ENVSUBST_FILTER: STATION_UPSTREAM
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    depends_on:
      game-station:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  station-cache:
